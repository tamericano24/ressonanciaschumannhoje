<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Folha de conferência das bandeiras</title>
<!-- Página de trabalho, não faz parte do site. Serve para olhar para todas as
     bandeiras de uma vez e apanhar cores ou desenhos trocados. Está no
     .assetsignore, portanto não é servida em producao. -->
<style>
  body { background:#0f1428; color:#e8ecf8; font:13px "Segoe UI",sans-serif; padding:20px; }
  h1 { font-size:16px; margin:0 0 14px; }
  .g { display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:12px; }
  .f { text-align:center; }
  svg.bandeira { width:52px; height:36.4px; border-radius:2px; outline:1px solid rgba(255,255,255,.22); outline-offset:-1px; }
  .n { font-size:10.5px; color:#9aa3c0; margin-top:4px; }
  .c { font-weight:700; font-size:10px; color:#e8ecf8; }
</style>
</head>
<body>
<h1>Bandeiras desenhadas em <code>js/bandeiras.js</code></h1>
<div class="g" id="g"></div>
<script src="js/bandeiras.js"></script>
<script>
  var NOMES = {
    US:"Estados Unidos",CA:"Canadá",MX:"México",GT:"Guatemala",SV:"Salvador",HN:"Honduras",

    var svg = window.BANDEIRA_SVG(k);
    if (!svg) { faltam.push(k); return ""; }
    return '<div class="f">' + svg + '<div class="n"><span class="c">' + k + "</span><br>" + NOMES[k] + "</div></div>";
  }).join("");
  if (faltam.length) {
    document.body.insertAdjacentHTML("beforeend",
      '<p style="color:#fbbf24;margin-top:18px">Sem desenho: ' + faltam.join(", ") + "</p>");
  }

</body>
</html>
