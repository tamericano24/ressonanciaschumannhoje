name: Leitura da Schumann

# Le o espectrograma de Tomsk, extrai a intensidade da Ressonancia de Schumann
# e publica o resultado na branch "dados".
#
# Porque numa branch a parte: o painel precisa de um valor novo de meia em meia
# hora, e guardar isso dentro do projeto encheria o historico de commits
# automaticos. A branch "dados" e reescrita de cada vez, portanto tem sempre um
# unico commit e nao cresce. O historico do projeto fica limpo.
#
# O painel le o ficheiro em:
#   https://raw.githubusercontent.com/<repo>/dados/schumann.json

on:
  schedule:
    - cron: "*/30 * * * *"     # de 30 em 30 minutos
  workflow_dispatch:           # permite correr a mao no separador Actions

permissions:
  contents: write

concurrency:                   # nunca duas execucoes ao mesmo tempo
  group: leitura-schumann
  cancel-in-progress: false

jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --quiet pillow numpy

      # O historico vive na branch dados e cresce a cada execucao. Como essa
      # branch e reescrita de cada vez, tem de ser trazido para aqui ANTES de
      # o ler-schumann.py lhe acrescentar a linha nova. Sem este passo, cada
      # execucao comecaria um historico do zero.
      #
      # Se o ficheiro ainda nao existir, na primeira vez, o curl falha e o
      # script comeca um historico novo: e por isso que este passo nunca
      # interrompe a execucao.
      - name: Trazer o historico ja guardado
        continue-on-error: true
        run: |
          url="https://raw.githubusercontent.com/${{ github.repository }}/dados/historico.json"
          if curl -fsSL --max-time 30 "$url" -o historico.json; then
            echo "historico anterior: $(wc -c < historico.json) bytes"
          else
            echo "sem historico anterior, comeca-se um novo"
            rm -f historico.json
          fi

      - name: Ler o espectrograma
        run: python ler-schumann.py

      - name: Publicar na branch dados
        run: |
          estado=$(python -c "import json;print(json.load(open('schumann.json'))['estado'])")
          echo "estado da leitura: $estado"

          # Branch orfa, reescrita de cada vez: fica sempre com um so commit.
          # O historico nao se perde porque foi descarregado no passo anterior
          # e volta a subir aqui, ja com a linha nova.
          tmp=$(mktemp -d)
          cp schumann.json historico.json "$tmp/"
          cd "$tmp"
          git init --quiet -b dados
          git config user.name  "leitura-automatica"
          git config user.email "actions@users.noreply.github.com"
          git add schumann.json historico.json
          git commit --quiet -m "Leitura de $(date -u +%Y-%m-%dT%H:%MZ) ($estado)"
          git push --quiet --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" dados

      - name: Publicar tambem na branch principal (para evitar rate limiting)
        run: |
          # Os ficheiros schumann.json e historico.json ja estao na raiz do repo
          # (foram criados pelo ler-schumann.py). Basta move-los para /dados e
          # fazer commit/push no branch atual (main).
          mkdir -p dados
          cp schumann.json historico.json dados/
          git config user.name  "leitura-automatica"
          git config user.email "actions@users.noreply.github.com"
          git add dados/schumann.json dados/historico.json
          # Só faz commit se houver mudanças
          if ! git diff --cached --quiet; then
            git commit --quiet -m "Atualizar dados: schumann.json e historico.json"
            git push --quiet \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:main
          else
            echo "Dados inalterados, sem commit"
          fi
